<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>My Apps</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f3f8;
  margin: 0;
  padding: 20px;
  color: #222;
}
h2 { text-align: center; }
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}
.card {
  background: white;
  padding: 20px 8px;
  border-radius: 15px;
  text-align: center;
  text-decoration: none;
  color: #222;
  box-shadow: 0 2px 8px #ddd;
}
.icon {
  font-size: 35px;
  display: block;
  margin-bottom: 10px;
}
button {
  margin-top: 12px;
  padding: 8px 20px;
  border: none;
  border-radius: 20px;
  background: #2481cc;
  color: white;
}
</style>
</head>

<body>
<h2>📱 My Apps</h2>
<div class="grid">

<a class="card" href="https://www.facebook.com/">
<span class="icon">📘</span>Facebook<button>OPEN</button></a>

<a class="card" href="https://www.instagram.com/">
<span class="icon">📸</span>Instagram<button>OPEN</button></a>

<a class="card" href="https://www.tiktok.com/">
<span class="icon">🎵</span>TikTok<button>OPEN</button></a>

<a class="card" href="https://www.threads.net/">
<span class="icon">🧵</span>Threads<button>OPEN</button></a>

<a class="card" href="https://www.youtube.com/">
<span class="icon">▶️</span>YouTube<button>OPEN</button></a>

<a class="card" href="https://www.google.com/">
<span class="icon">🔎</span>Google<button>OPEN</button></a>

<a class="card" href="https://www.gmail.com/">
<span class="icon">✉️</span>Gmail<button>OPEN</button></a>

<a class="card" href="https://www.reddit.com/">
<span class="icon">💬</span>Reddit<button>OPEN</button></a>

</div>
</body>
</html>
